<section class="pane baihua" aria-label="白话"><span class="badge">白话</span>
<p>有个农夫种茄子总也种不活，向老菜农请教办法。老菜农说：“这不难，每棵茄子底下埋一文钱就活了。”农夫问是什么道理，老菜农回答说：“有钱的就活，没钱的就死。”</p>
<figure class="fig"><img src="/古艳部/004-贪官/images/01.webp" alt="《贪官》配图" loading="lazy" width="720" height="480"></figure>
</section>
<div class="divider" aria-hidden="true"><span>以下为原文</span></div>
<section class="pane yuanwen" lang="zh-Hans" aria-label="原文"><span class="badge">原文</span><span class="seal" aria-hidden="true">原文</span>
<p>有农夫种茄不活，求计于老圃。老圃曰：“此不难，每茄树下埋钱一文即活。”问其何故，答曰：“有钱者生，无钱者死。”</p>
